    size: [0.70, 0.46, 0.012]
    center: [1.60, 0.65, 0.757]
    color: [0.10, 0.48, 0.95, 0.24]
  dropoff:
    size: [0.48, 0.38, 0.012]
    center: [-2.35, 2.15, 0.757]
    color: [0.10, 0.82, 0.42, 0.30]

robot:
  size: [0.60, 0.45, 0.35]
  color: [0.08, 0.22, 0.48, 1.0]
  start: [-3.0, 0.0, 0.0]
  lower_limits: [-3.7, -2.7, -3.141592653589793]
  upper_limits: [2.7, 2.7, 3.141592653589793]

arm:
  model_url: package://drake_models/iiwa_description/sdf/iiwa7_with_box_collision.sdf
  model_name_prefix: mobile
  base_frame: iiwa_link_0
  end_effector_frame: iiwa_link_7
  mount_translation: [0.0, 0.0, 0.20]
  home_positions: [0.0, 0.45, 0.0, -1.2, 0.0, 0.75, 0.0]

gripper:
  model_url: package://drake_models/wsg_50_description/sdf/schunk_wsg_50_with_tip.sdf
  model_name_prefix: mobile
  base_frame: body
  mount_translation: [0.0, 0.0, 0.114]
  mount_rpy: [1.5707963267948966, 0.0, 1.5707963267948966]
  open_positions: [-0.045, 0.045]
  closed_positions: [-0.006, 0.006]
  grasp_point_in_body: [0.0, 0.10, 0.0]

semantic_regions:
  room1:
    x_bounds: [-3.9, -0.1]
    y_bounds: [-2.9, 2.9]
    display_height: 0.015
    color: [0.10, 0.45, 0.90, 0.16]
  room2:
    x_bounds: [0.1, 2.9]
    y_bounds: [-1.4, 1.4]
    display_height: 0.015
    color: [0.10, 0.80, 0.30, 0.20]

gcs_base_planning:
  bezier_order: 3
  path_length_weight: 1.0
  yaw_path_weight: 0.35
  time_weight: 0.05
  maximum_speed: 1.0
  maximum_angular_speed: 1.2
  samples_per_second: 20
  regions:
    - name: room1_central_lane
      lower: [-3.65, -0.55]
      upper: [-0.25, 0.55]
      yaw_bounds: [-0.25, 1.75]
      color: [0.10, 0.72, 0.92, 0.18]
    - name: room1_upper_lane
      lower: [-3.15, 0.40]
      upper: [-0.55, 1.40]
      yaw_bounds: [0.0, 2.0]
      color: [0.62, 0.32, 0.92, 0.20]
    - name: doorway_lane
      lower: [-0.45, -0.25]
      upper: [0.45, 0.25]
      yaw_bounds: [-0.30, 0.30]
      color: [1.00, 0.56, 0.08, 0.34]
    - name: room2_pickup_lane
      lower: [0.25, -0.45]
      upper: [1.35, 0.05]
      yaw_bounds: [-0.60, 0.60]
      color: [0.10, 0.84, 0.58, 0.24]

semantic_product_planning:
  initial_mode: seeking_pickup
  goal_mode: delivered
  region_predicates:
    room1_central_lane: [base_in_room1]
    room1_upper_lane: [base_in_room1, at_dropoff]
    doorway_lane: [inside_doorway]
    room2_pickup_lane: [base_in_room2, near_pickup_table]
  transitions:
    - name: pick_cup
      source: seeking_pickup
      target: carrying_cup
      requires: [base_in_room2, near_pickup_table]
      cost: 0.25
    - name: place_cup
      source: carrying_cup
      target: delivered
      requires: [base_in_room1, at_dropoff]
      cost: 0.25

whole_body_planning:
  joint_path_weight: 0.12
  maximum_joint_speed: 1.20
  arm_envelope_margin: 0.04
  transit_arm_margin: 0.015
  joint_lower_limits: [-2.967, -2.094, -2.967, -2.094, -2.967, -2.094, -3.054]
  joint_upper_limits: [2.967, 2.094, 2.967, 2.094, 2.967, 2.094, 3.054]
  region_arm_anchors:
    room2_pickup_lane: [start, carry]
    doorway_lane: [carry]
    room1_central_lane: [carry]
    room1_upper_lane: [carry, goal]

iris_np2_doorway:
  seed_base_q: [0.0, 0.0, 0.0]
  base_lower: [-0.70, -1.00, -0.40]
  base_upper: [0.70, 1.00, 0.40]
  joint_radius: 0.40
  starting_radius: 0.015
  particles: 300
  ray_particles: 150
  max_iterations: 3
  max_separating_iterations: 12
  max_planes_per_iteration: 8
  mixing_steps: 30
  epsilon: 0.02
  delta: 0.05
  configuration_space_margin: 0.005
  random_seed: 1234
  verbose: false
  holdout_samples: 1000
  holdout_mixing_steps: 10
  holdout_random_seed: 8128

iris_np2_cover:
  joint_radius: 0.48
  starting_radius: 0.006
  seed_distance_threshold: 0.42
  seed_metric_weights: [1.0, 1.0, 0.45, 0.22, 0.22, 0.22, 0.22, 0.22, 0.22, 0.22]
  particles: 220
  ray_particles: 120
