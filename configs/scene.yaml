scenario:
  name: two_room_cup_delivery
  instruction: Pick the blue cup from Room 2 and place it in the green bin in Room 1.
  semantic_sequence:
    - base_in_room1
    - base_in_room2
    - near_pickup_table
    - cup_grasped
    - cup_in_dropoff_bin
  near_pickup_distance: 1.0

