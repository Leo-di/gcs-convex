  max_separating_iterations: 12
  max_planes_per_iteration: 8
  mixing_steps: 25
  epsilon: 0.02
  total_delta: 0.05
  configuration_space_margin: 0.005
  random_seed: 2200
  verbose: false
  holdout_samples_per_region: 200
  holdout_mixing_steps: 8
  holdout_random_seed: 9200

reference_path:
