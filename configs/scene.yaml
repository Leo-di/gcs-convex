    size: [1.20, 0.80, 0.75]
    center: [1.60, 0.65, 0.375]
    top_thickness: 0.08
    leg_size: 0.07
    color: [0.42, 0.20, 0.07, 1.0]
    edge_color: [0.24, 0.09, 0.03, 1.0]
  dropoff_table:
