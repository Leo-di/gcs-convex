    color: [0.72, 0.74, 0.76, 1.0]
    accent_color: [0.16, 0.18, 0.21, 1.0]
  mobile_cart:
    size: [0.72, 0.48, 0.82]
    center: [-1.35, -2.32, 0.41]
    color: [0.22, 0.25, 0.29, 1.0]
    shelf_color: [0.80, 0.82, 0.84, 1.0]
