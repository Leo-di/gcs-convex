    center: [-0.5, 0.0, -0.05]
    color: [0.85, 0.85, 0.85, 1.0]

  floor_grid:
    spacing: 0.50
    line_width: 0.008
    color: [0.62, 0.65, 0.68, 0.35]

  walls:
    - name: room1_left_wall
      size: [0.10, 6.0, 2.0]
      center: [-4.0, 0.0, 1.0]
    - name: room1_top_wall
      size: [4.0, 0.10, 2.0]
      center: [-2.0, 3.0, 1.0]
    - name: room1_bottom_wall
      size: [4.0, 0.10, 2.0]
      center: [-2.0, -3.0, 1.0]
    - name: shared_wall_upper
      size: [0.10, 2.4, 2.0]
      center: [0.0, 1.8, 1.0]
    - name: shared_wall_lower
      size: [0.10, 2.4, 2.0]
      center: [0.0, -1.8, 1.0]
    - name: doorway_header
      size: [0.12, 1.2, 0.35]
      center: [0.0, 0.0, 1.825]
    - name: room2_right_wall
      size: [0.10, 3.0, 2.0]
      center: [3.0, 0.0, 1.0]
    - name: room2_top_wall
      size: [3.0, 0.10, 2.0]
      center: [1.5, 1.5, 1.0]
    - name: room2_bottom_wall
      size: [3.0, 0.10, 2.0]
      center: [1.5, -1.5, 1.0]

  wall_color: [0.75, 0.75, 0.78, 1.0]

objects:
