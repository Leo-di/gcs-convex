  grasp_offset: [0.0, 0.0, 0.02]
  lift_offset: [0.0, 0.0, 0.30]
  position_tolerance: 0.005
  minimum_clearance: 0.003

delivery_task:
  carry_cup_height: 1.10
  transfer_path:
    - [1.20, -0.10, 0.0]
    - [0.80, -0.35, -0.4]
    - [0.35, 0.00, 0.0]
    - [-0.35, 0.00, 0.0]
    - [-1.00, 0.30, 0.4]
    - [-1.60, 0.80, 0.75]
    - [-2.05, 1.12, 1.20]
    - [-2.35, 1.30, 1.5707963267948966]
  place_cup_center: [-2.35, 2.15, 0.886]
  preplace_height: 0.22
  position_tolerance: 0.005
  orientation_tolerance: 0.06
  minimum_clearance: 0.003
